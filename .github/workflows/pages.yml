# Деплой на GitHub Pages: пуш в main собирает и выкатывает страницу.
# Переменные окружения сборки задаются в Settings → Secrets and variables →
# Actions → Variables: VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY,
# VITE_VAPID_PUBLIC_KEY (всё это публичные значения, не секреты).
# В Settings → Pages источник должен быть «GitHub Actions».

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Проектная страница живёт на /<имя репозитория>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Значения по умолчанию — публичные по архитектуре (anon-ключ и так
          # виден в бандле, безопасность на RLS); Variables репозитория их переопределяют.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://qlanlvhxiixdhozpsbwr.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsYW5sdmh4aWl4ZGhvenBzYndyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2Mzg5NDksImV4cCI6MjEwMTIxNDk0OX0.BC-Z5eliOdb2TkLjgcvUCP_ooHqe7pwO8HG4xAxzg_A' }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY || 'BDkcPQ3wqbpY14s07cjdkCvjCZDZIjM2ui8FdqB8Lw2kg-2bjTFzULt13zOOxx_V-FPAPUe0mUCukTuvUkZ5e7U' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
